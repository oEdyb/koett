name: Windows and Linux

# Manual only, on Olle's call. No run starts by itself. See "Required checks" in AGENTS.md:
# gh workflow run cross-platform.yml --ref BRANCH
on:
  workflow_dispatch:
    inputs:
      clean:
        description: Release build, using and saving no caches
        type: boolean
        default: false
      packaging_only:
        description: Build installers and run packaging checks; omit unchanged Rust suites and inference probes
        type: boolean
        default: false
      windows_only:
        description: Recheck only Windows; use after an unchanged Linux batch already passed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Replaced caches would otherwise sit there for a week, counting against the 10 GB limit.
  cache-trim:
    needs: [msrv, windows, linux]
    if: ${{ !inputs.windows_only && !cancelled() && github.ref == 'refs/heads/main' && !inputs.clean }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete replaced caches
        env:
          GH_TOKEN: ${{ github.token }}
          # Every cache a main run saves. Keep in step with the jobs below.
          CACHE_KEYS: |
            cargo-v2-msrv-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
            cargo-v2-windows-2025-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
            cargo-v2-linux-x86_64-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
            cargo-v2-linux-arm64-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
            native-v1-windows-2025-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
            native-v1-ubuntu-22.04-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
            native-v1-ubuntu-22.04-arm-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
            model-v1-windows-2025-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
            model-v1-ubuntu-22.04-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
            model-v1-ubuntu-22.04-arm-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
        run: |
          month=$(date -u +%Y%m)
          export CACHE_KEYS="$CACHE_KEYS"$'\n'"apt-v1-x86_64-$month"$'\n'"apt-v1-arm64-$month"
          python3 scripts/ci_trim_caches.py

  dependency-review:
    # Compares the branch with main, so there's nothing to compare on main itself.
    if: ${{ !inputs.windows_only && github.ref != 'refs/heads/main' && !inputs.clean }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: main
          head-ref: ${{ github.sha }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  supply-chain:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Check workflow pins
        run: python3 scripts/test_workflow_pins.py
      - name: Test cache trimming
        run: python3 scripts/test_ci_trim_caches.py
      - name: Test Windows dependency gate
        run: python3 scripts/test_windows_dependencies.py
      - name: Test native build configuration
        run: python3 scripts/test_build_asr_native.py
      - name: Test pinned encoder-sharing patch
        run: python3 scripts/test_shared_context_patch.py
      - name: Test ASR wrapper provenance
        run: python3 scripts/test_sherpa_wrapper.py
      - name: Test build receipts
        run: python3 scripts/test_build_receipt.py
      - name: Test supply-chain inventory
        run: python3 scripts/test_supply_chain_inventory.py
      - name: Check supply-chain inventory
        run: python3 scripts/generate_supply_chain_inventory.py --check
      - name: Check distributable notices
        run: python3 scripts/check_linux_notices.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit

  msrv:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Azure mirror sometimes crawls: 16.5 MB once took 7 minutes. A monthly key picks
      # up new versions, and anything missing from the cache still downloads.
      - name: Pick system package cache
        id: apt_month
        run: echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
      - name: Restore system packages
        id: apt_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs/*.deb
          key: apt-v1-x86_64-${{ steps.apt_month.outputs.month }}
          restore-keys: apt-v1-x86_64-
      - name: Install system packages
        run: |
          mkdir -p ~/apt-debs/partial
          options="-o Dir::Cache::archives=$HOME/apt-debs -o Acquire::Retries=3"
          sudo apt-get update
          sudo apt-get install $options -y --no-install-recommends \
            clang cmake libasound2-dev libfontconfig1-dev libudev-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-4-dev ninja-build pkg-config
      - name: Save system packages
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs/*.deb
          key: apt-v1-x86_64-${{ steps.apt_month.outputs.month }}
      - name: Install minimum Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Restore Cargo cache
        id: cargo_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-msrv-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
          restore-keys: cargo-v2-msrv-
      - name: Check minimum Rust
        run: DOCS_RS=1 cargo +1.92.0 check --locked --all-targets
      - name: Drop Koett's own build output from the cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/*/incremental target/*/koett* target/*/deps/*koett* target/*/build/koett*
      - name: Save Cargo cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-msrv-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      KOETT_REQUIRE_SHARED_CONTEXT: 1
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Parse Windows lab checks
        shell: pwsh
        run: ./scripts/check_powershell.ps1
      - name: Restore native libraries
        id: native_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            CrossPlatform/native-build/lib
            CrossPlatform/native-build/build-receipt.json
          key: native-v1-windows-2025-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
      - name: Build ASR-only native libraries
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: python scripts/build_asr_native.py --generator "Visual Studio 18 2026" --jobs 4
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            CrossPlatform/native-build/lib
            CrossPlatform/native-build/build-receipt.json
          key: native-v1-windows-2025-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
      - name: Restore Cargo cache
        id: cargo_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-windows-2025-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
          restore-keys: cargo-v2-windows-2025-
      - name: Restore speech model
        id: model_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/DybergCo/Koett/data/models
          key: model-v1-windows-2025-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
      - name: Require Windows shared-context native patch
        shell: pwsh
        run: >-
          python -c "import json; from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); from shared_context_patch import PATCHED_SHA256; receipt=json.loads(Path('native-build/build-receipt.json').read_text()); assert receipt['target']=='x86_64-pc-windows-msvc'; assert receipt['shared_context_sha256']==PATCHED_SHA256; assert ('patch='+PATCHED_SHA256+'\n') in Path('native-build/lib/koett-context.txt').read_text()"
      - name: Test
        if: ${{ !inputs.packaging_only }}
        run: cargo test --locked
      - name: Lint
        if: ${{ !inputs.packaging_only }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin koett --bin koett-engine
      - name: Build native transcription CLI
        run: cargo build --release --locked --bin koett-transcribe-engine
      - name: Check clean-Windows DLL dependencies
        run: python scripts/check_windows_dependencies.py target/release/koett.exe
      - name: Check transcription CLI DLL dependencies
        run: python scripts/check_windows_dependencies.py target/release/koett-transcribe-engine.exe
      - name: Test Windows self-test retry policy
        shell: pwsh
        run: ./scripts/test_windows_self_test.ps1
      - name: Runtime self-test
        if: ${{ !inputs.packaging_only }}
        shell: pwsh
        run: |
          cargo build --release --locked --bin koett-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/run_windows_self_test.ps1
      - name: Runtime long-input probe
        if: ${{ !inputs.packaging_only }}
        timeout-minutes: 5
        run: cargo run --release --locked --bin koett-engine -- --long-self-test 420
      - name: Save speech model
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/DybergCo/Koett/data/models
          key: model-v1-windows-2025-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
      - name: Test Windows packaging policy
        run: python -m unittest discover -s scripts -p 'test_package_windows.py'
      - name: Check Windows preview manager syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/manage_windows_preview.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Package
        run: python scripts/package_windows.py
      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco upgrade nsis.install --version=3.12.0 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installer packaging
        run: python -m unittest discover -s scripts -p 'test_package_windows_installer.py'
      - name: Build native Windows installer
        shell: pwsh
        run: |
          python scripts/package_windows_installer.py --payload dist/Koett-Windows-x86_64 --output dist/Koett-Windows-x86_64-Setup.exe --compiler 'C:\Program Files (x86)\NSIS\makensis.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write Windows installer checksum and build receipt
        run: >-
          python scripts/write_build_receipt.py
          --artifact dist/Koett-Windows-x86_64-Setup.exe
          --target x86_64-pc-windows-msvc
          --output-directory dist
      - name: Verify Windows archive notices
        run: python scripts/check_windows_archive.py --archive dist/Koett-Windows-x86_64.zip
      - name: Write checksum and build receipt
        run: >-
          python scripts/write_build_receipt.py
          --artifact dist/Koett-Windows-x86_64.zip
          --target x86_64-pc-windows-msvc
          --output-directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Koett-Windows-x86_64
          path: |
            CrossPlatform/dist/Koett-Windows-x86_64.zip
            CrossPlatform/dist/Koett-Windows-x86_64.zip.sha256
            CrossPlatform/dist/Koett-Windows-x86_64.zip.build-receipt.json
            CrossPlatform/dist/Koett-Windows-x86_64-Setup.exe
            CrossPlatform/dist/Koett-Windows-x86_64-Setup.exe.sha256
            CrossPlatform/dist/Koett-Windows-x86_64-Setup.exe.build-receipt.json
          if-no-files-found: error
      - name: Drop Koett's own build output from the cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/*/incremental target/*/koett* target/*/deps/*koett* target/*/build/koett*
      - name: Save Cargo cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-windows-2025-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}

  linux:
    if: ${{ !inputs.windows_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            machine: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            architecture: arm64
            machine: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CrossPlatform
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      KOETT_REQUIRE_SHARED_CONTEXT: 1
      # Auto-update for archive installs. The public key only; the private key never comes
      # near CI. Raise the build with every release, or no installed app will be offered it.
      KOETT_UPDATE_FEED: https://github.com/oEdyb/koett/releases/latest/download/appcast-linux-${{ matrix.machine }}.json
      KOETT_UPDATE_PUBLIC_KEY: I+ZaL5YxtKgUOxHWxzZApQ2914ztnA/Y24oYzdGXYrg=
      KOETT_UPDATE_BUILD: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Azure mirror sometimes crawls: 16.5 MB once took 7 minutes. A monthly key picks
      # up new versions, and anything missing from the cache still downloads.
      - name: Pick system package cache
        id: apt_month
        run: echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
      - name: Restore system packages
        id: apt_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs/*.deb
          key: apt-v1-${{ matrix.architecture }}-${{ steps.apt_month.outputs.month }}
          restore-keys: apt-v1-${{ matrix.architecture }}-
      - name: Install system packages
        run: |
          mkdir -p ~/apt-debs/partial
          options="-o Dir::Cache::archives=$HOME/apt-debs -o Acquire::Retries=3"
          sudo apt-get update
          sudo apt-get install $options -y --no-install-recommends \
            clang cmake libasound2-dev libfontconfig1-dev libudev-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-4-dev ninja-build pkg-config rpm libarchive-tools zstd
      - name: Save system packages
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs/*.deb
          key: apt-v1-${{ matrix.architecture }}-${{ steps.apt_month.outputs.month }}
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Restore native libraries
        id: native_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            CrossPlatform/native-build/lib
            CrossPlatform/native-build/build-receipt.json
          key: native-v1-${{ matrix.runner }}-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
      - name: Build ASR-only native libraries
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_asr_native.py --jobs 2
      - name: Save native libraries
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            CrossPlatform/native-build/lib
            CrossPlatform/native-build/build-receipt.json
          key: native-v1-${{ matrix.runner }}-${{ hashFiles('CrossPlatform/scripts/build_asr_native.py', 'CrossPlatform/scripts/shared_context_patch.py', 'CrossPlatform/scripts/shared_context.patch') }}
      - name: Restore Cargo cache
        id: cargo_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-linux-${{ matrix.architecture }}-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
          # By architecture: a runner name would also match ubuntu-22.04-arm's caches.
          restore-keys: cargo-v2-linux-${{ matrix.architecture }}-
      - name: Restore speech model
        id: model_cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/koett/models
          key: model-v1-${{ matrix.runner }}-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
      - name: Test
        if: ${{ !inputs.packaging_only }}
        run: cargo test --locked
      - name: Lint
        if: ${{ !inputs.packaging_only }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin koett
      - name: Test runtime self-test retry policy
        run: python3 -m unittest discover -s scripts -p test_runtime_self_test.py
      - name: Runtime self-test
        if: ${{ !inputs.packaging_only }}
        id: asr_self_test
        run: python3 scripts/run_runtime_self_test.py cargo run --release --locked --bin koett-engine -- --self-test
      - name: Save speech model
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/koett/models
          key: model-v1-${{ matrix.runner }}-${{ hashFiles('CrossPlatform/src/model.rs', 'CrossPlatform/src/paths.rs') }}
      - name: Capture native inference failure
        if: failure() && steps.asr_self_test.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          mkdir -p diagnostics
          gdb --batch --return-child-result -ex run -ex 'thread apply all bt' \
            --args target/release/koett-engine --self-test \
            > diagnostics/native-asr-backtrace.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.asr_self_test.outcome == 'failure'
        with:
          name: native-asr-failure-${{ matrix.architecture }}
          path: |
            CrossPlatform/diagnostics/native-asr-backtrace.log
            CrossPlatform/native-build/build-receipt.json
          if-no-files-found: warn
      - name: Test Linux packaging
        run: python3 -m unittest discover -s scripts -p 'test_package_linux*.py'
      - name: Package
        run: |
          strip target/release/koett
          python3 scripts/package_linux.py --flavor system-runtime --output dist
      - name: Build native distro packages
        run: |
          archive=$(find dist -maxdepth 1 -name 'Koett-Linux-*.tar.gz' -print -quit)
          checksum=$(sha256sum "$archive" | cut -d ' ' -f1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for format in deb rpm arch; do
            nice -n 10 python3 scripts/package_linux_native.py \
              --archive "$archive" --archive-sha256 "$checksum" --source-revision "$GITHUB_SHA" \
              --format "$format" --architecture "${{ matrix.architecture == 'arm64' && 'aarch64' || 'x86_64' }}" \
              --version "$version" --output dist
          done
          for artifact in dist/koett-*.deb dist/koett-*.rpm dist/koett-*.pkg.tar.zst; do
            python3 scripts/write_build_receipt.py --artifact "$artifact" --target "${{ matrix.target }}" --output-directory dist
          done
      - name: Verify extracted release candidate
        run: |
          python3 scripts/test_package_linux_archive.py --archive dist/Koett-Linux-*.tar.gz
      - name: Write checksum and build receipt
        run: >-
          python3 scripts/write_build_receipt.py
          --artifact dist/Koett-Linux-*.tar.gz
          --target ${{ matrix.target }}
          --output-directory dist
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Koett-Linux-${{ matrix.architecture }}-system-runtime
          path: |
            CrossPlatform/dist/Koett-Linux-*.tar.gz
            CrossPlatform/dist/Koett-Linux-*.tar.gz.sha256
            CrossPlatform/dist/Koett-Linux-*.tar.gz.build-receipt.json
            CrossPlatform/dist/koett-*.deb
            CrossPlatform/dist/koett-*.deb.sha256
            CrossPlatform/dist/koett-*.rpm
            CrossPlatform/dist/koett-*.rpm.sha256
            CrossPlatform/dist/koett-*.pkg.tar.zst
            CrossPlatform/dist/koett-*.pkg.tar.zst.sha256
            CrossPlatform/dist/koett-*.build-receipt.json
          if-no-files-found: error
      - name: Drop Koett's own build output from the cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/*/incremental target/*/koett* target/*/deps/*koett* target/*/build/koett*
      - name: Save Cargo cache
        if: github.ref == 'refs/heads/main' && !inputs.clean && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            CrossPlatform/target
          key: cargo-v2-linux-${{ matrix.architecture }}-${{ hashFiles('CrossPlatform/Cargo.lock', 'CrossPlatform/Cargo.toml', 'CrossPlatform/rust-toolchain.toml', 'CrossPlatform/.cargo/config.toml') }}
