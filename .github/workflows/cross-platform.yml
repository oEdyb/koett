name: Windows and Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CrossPlatform/**"
      - ".github/workflows/cross-platform.yml"
  push:
    branches:
      - main
    paths:
      - "CrossPlatform/**"
      - ".github/workflows/cross-platform.yml"

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  supply-chain:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Check workflow pins
        run: python3 scripts/test_workflow_pins.py
      - name: Test build receipts
        run: python3 scripts/test_build_receipt.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit

  msrv:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libasound2-dev libfontconfig1-dev libudev-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev pkg-config
      - name: Install minimum Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Check minimum Rust
        run: cargo +1.92.0 check --locked --all-targets

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin koett
      - name: Runtime self-test
        run: cargo run --release --locked --bin koett-engine -- --self-test
      - name: Runtime long-input probe
        timeout-minutes: 5
        run: cargo run --release --locked --bin koett-engine -- --long-self-test 420
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/Koett-Windows-x86_64
          Copy-Item target/release/koett.exe dist/Koett-Windows-x86_64/Koett.exe
          Copy-Item README.md,THIRD_PARTY_NOTICES.md,../LICENSE dist/Koett-Windows-x86_64/
          Compress-Archive -Path dist/Koett-Windows-x86_64 -DestinationPath dist/Koett-Windows-x86_64.zip
      - name: Write checksum and build receipt
        run: >-
          python scripts/write_build_receipt.py
          --artifact dist/Koett-Windows-x86_64.zip
          --target x86_64-pc-windows-msvc
          --output-directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Koett-Windows-x86_64
          path: |
            CrossPlatform/dist/Koett-Windows-x86_64.zip
            CrossPlatform/dist/Koett-Windows-x86_64.zip.sha256
            CrossPlatform/dist/Koett-Windows-x86_64.zip.build-receipt.json
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            architecture: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libasound2-dev libfontconfig1-dev libudev-dev \
            libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin koett
      - name: Runtime self-test
        run: cargo run --release --locked --bin koett-engine -- --self-test
      - name: Package
        run: |
          strip target/release/koett
          install -Dm755 target/release/koett dist/Koett-Linux-${{ matrix.architecture }}/koett
          install -Dm755 packaging/linux/install.sh dist/Koett-Linux-${{ matrix.architecture }}/install.sh
          install -Dm644 packaging/linux/com.olledyberg.Koett.desktop \
            dist/Koett-Linux-${{ matrix.architecture }}/com.olledyberg.Koett.desktop
          install -Dm644 packaging/linux/com.olledyberg.Koett.svg \
            dist/Koett-Linux-${{ matrix.architecture }}/com.olledyberg.Koett.svg
          install -Dm644 README.md THIRD_PARTY_NOTICES.md ../LICENSE \
            -t dist/Koett-Linux-${{ matrix.architecture }}
          tar -C dist -czf dist/Koett-Linux-${{ matrix.architecture }}.tar.gz \
            Koett-Linux-${{ matrix.architecture }}
      - name: Write checksum and build receipt
        run: >-
          python3 scripts/write_build_receipt.py
          --artifact dist/Koett-Linux-${{ matrix.architecture }}.tar.gz
          --target ${{ matrix.target }}
          --output-directory dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Koett-Linux-${{ matrix.architecture }}
          path: |
            CrossPlatform/dist/Koett-Linux-${{ matrix.architecture }}.tar.gz
            CrossPlatform/dist/Koett-Linux-${{ matrix.architecture }}.tar.gz.sha256
            CrossPlatform/dist/Koett-Linux-${{ matrix.architecture }}.tar.gz.build-receipt.json
          if-no-files-found: error
