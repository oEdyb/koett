[package]
name = "koett-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[dependencies]
cpal = "=0.18.2"
bzip2 = "=0.6.1"
directories = "=6.0.0"
ringbuf = "=0.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sherpa-onnx = { version = "=1.13.5", default-features = false, features = ["static"] }
sha2 = { version = "=0.11.0", default-features = false }
tar = { version = "=0.4.46", default-features = false }
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
ureq = { version = "=3.4.0", default-features = false, features = ["native-tls", "platform-verifier"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
ashpd = { version = "=0.13.13", default-features = false, features = ["clipboard", "global_shortcuts", "remote_desktop", "screencast", "tokio"] }
futures-util = "=0.3.34"
global-hotkey = "=0.8.0"
ksni = { version = "=0.3.6", features = ["blocking"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
x11rb = { version = "=0.13.2", features = ["xtest"] }
xkeysym = "=0.2.1"
ureq = { version = "=3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "=3.4.0", default-features = false, features = ["platform-verifier", "rustls"] }
