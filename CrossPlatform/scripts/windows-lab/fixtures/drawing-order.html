<!doctype html><meta charset="utf-8"><title>Drawing order composer</title><style>body{font:22px sans-serif;margin:30px}#editor{border:2px solid;padding:20px;min-height:180px;white-space:pre-wrap}img{max-width:300px}textarea{width:100%;height:160px}</style><h1>Drawing order composer</h1><div id="editor" contenteditable role="textbox" aria-label="Drawing order editor"></div><textarea id="receipt" aria-label="Drawing order receipt" readonly></textarea><script>
let events=[],images=0;function report(){receipt.value=JSON.stringify({events,text:editor.innerText,images});fetch('/m4-paste-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:new URLSearchParams(location.search).get('case'),events,text:editor.innerText,images})})}editor.addEventListener('paste',async e=>{e.preventDefault();let text=e.clipboardData.getData('text/plain'),file=[...e.clipboardData.items].find(x=>x.kind==='file'&&x.type.startsWith('image/'))?.getAsFile();events.push({ms:performance.now(),text,image:!!file});if(file){const saved=editor.innerText;const bitmap=await createImageBitmap(file);const canvas=document.createElement('canvas');canvas.width=Math.min(2000,bitmap.width);canvas.height=Math.round(bitmap.height*canvas.width/bitmap.width);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);setTimeout(()=>{editor.innerText=saved;let image=document.createElement('img');image.src=canvas.toDataURL();editor.append(image);images++;report()},750)}else if(text){editor.append(document.createTextNode(text));report()}});editor.focus();
</script>
