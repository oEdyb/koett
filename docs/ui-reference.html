<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koett native UI reference</title><style>
:root{--koett-ink:#242424;--koett-soft:#686763;--koett-base:#faf9f6;--koett-panel:#f2f1ed;--koett-line:#deddd7;--koett-accent:#ac3d31;--koett-tint:#f2e4df;--koett-focus:#9e3429;--koett-space:16px}
*{box-sizing:border-box}body{margin:0;color:var(--koett-ink);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--koett-focus);outline-offset:3px}button{border:1px solid var(--koett-line);background:var(--koett-base);color:inherit;border-radius:7px;padding:7px 12px}button:hover{background:var(--koett-panel)}.app{border:1px solid var(--koett-line);border-radius:12px;overflow:hidden;background:var(--koett-base)}header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--koett-line)}.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:17px;margin-right:auto}.mark{color:var(--koett-accent);display:flex;align-items:center;gap:3px;height:22px}.mark i{display:block;width:3px;border-radius:3px;background:currentColor}.mark i:nth-child(1),.mark i:nth-child(5){height:9px}.mark i:nth-child(2),.mark i:nth-child(4){height:16px}.mark i:nth-child(3){height:22px}.primary{background:var(--koett-accent);border-color:var(--koett-accent);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600}.primary:hover{background:#923126}.record-dot{width:8px;height:8px;border-radius:50%;background:currentColor}.status{font-size:12px;color:var(--koett-soft)}kbd{font:11px system-ui;border:1px solid var(--koett-line);padding:1px 5px;border-radius:4px;margin-left:4px}.workspace{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:445px}.library{border-right:1px solid var(--koett-line);padding:14px 10px}.search{width:100%;padding:9px 11px;border:1px solid var(--koett-line);border-radius:7px;background:var(--koett-base);color:inherit}.overline{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--koett-soft);margin:20px 9px 8px}.entry{display:block;text-align:left;width:100%;background:none;border:0;border-radius:7px;padding:11px 10px;margin:3px 0;line-height:1.5}.entry.selected{background:var(--koett-tint)}.entry time{display:block;font-size:11px;color:var(--koett-soft);margin-bottom:5px}.snippet{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail{padding:25px 28px;min-width:0}.detail-head{display:flex;align-items:flex-start;gap:8px}.metadata{margin-right:auto;font-size:12px;color:var(--koett-soft)}.date{font-size:14px;color:var(--koett-ink);font-weight:600;margin-bottom:4px}.actions{display:flex;gap:7px}.actions button{font-size:12px;padding:6px 10px}.transcript{white-space:pre-wrap;font-size:16px;line-height:1.8;margin-top:27px;max-width:65ch}.foot{border-top:1px solid var(--koett-line);padding:9px 18px;color:var(--koett-soft);font-size:11px;display:flex;justify-content:space-between}.caption{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted-foreground,#666);padding:11px 0}.plain{border:0;background:none;padding:2px 0;color:inherit}.settings{display:none;padding:24px;max-width:560px;margin:auto;width:100%;min-height:445px}.settings h2{font-size:17px;margin:0 0 22px}.group{margin:20px 0}.group h3{font-size:12px;color:var(--koett-soft);margin:0 0 9px}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--koett-line)}select{max-width:230px;border:1px solid var(--koett-line);border-radius:6px;padding:6px;background:var(--koett-base);color:inherit}.setting input{accent-color:var(--koett-accent);width:18px;height:18px}.settings-open .workspace{display:none}.settings-open .settings{display:block}.empty{color:var(--koett-soft);padding:16px 8px}.back{display:none;margin-bottom:10px}
@media(prefers-color-scheme:dark){:root{--koett-ink:#eeede9;--koett-soft:#b0aea8;--koett-base:#222322;--koett-panel:#2c2d2b;--koett-line:#41423d;--koett-accent:#b44537;--koett-tint:#46312e;--koett-focus:#efb2a6}}
@media(max-width:580px){header{padding:12px}.status{display:none}.workspace{grid-template-columns:1fr}.library{border-right:0}.detail{display:none;padding:20px}.app.reading .library{display:none}.app.reading .detail{display:block}.back{display:inline-block}.detail-head{flex-wrap:wrap}.metadata{width:100%;margin-bottom:8px}.foot span:last-child{display:none}.caption{font-size:11px}.settings{padding:20px}header button{font-size:12px}}
</style></head><body><div class="app" id="app"><header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Koett</div><span class="status" id="status" role="status">Ready</span><button class="primary" id="record"><span class="record-dot" aria-hidden="true"></span><span id="record-label">Record</span></button><button id="settings-button">Settings</button></header><div class="workspace"><aside class="library" aria-label="Transcript history"><input class="search" id="search" type="search" placeholder="Search transcripts" aria-label="Search transcripts"><div class="overline">Today</div><div id="entries"></div></aside><main class="detail"><button class="plain back" id="back">← History</button><div class="detail-head"><div class="metadata"><div class="date" id="date">Today, 10:42</div><span>Parakeet · Local</span></div><div class="actions"><button id="copy">Copy</button><button id="export">Export</button></div></div><div class="transcript" id="transcript"></div></main></div><section class="settings" aria-label="Settings"><h2>Settings</h2><div class="group"><h3>Input</h3><label class="setting">Microphone<select><option>System default</option><option>Built-in microphone</option></select></label></div><div class="group"><h3>Recording</h3><label class="setting">Mode<select><option>Toggle</option><option>Hold to talk</option></select></label><div class="setting"><span>Shortcut</span><button>Ctrl + Shift + Space</button></div></div><div class="group"><h3>General</h3><label class="setting">Launch at login<input type="checkbox" checked></label><label class="setting">Pause media while recording<input type="checkbox"></label></div></section><footer class="foot"><span id="footer-state">Ctrl + Shift + Space to record</span><span>Saved on this device</span></footer></div><div class="caption"><span>Design reference · example transcripts</span><button class="plain" id="reset">Reset example</button></div><script>
const examples=[{time:'10:42',text:"The Linux version should feel simple from the moment you open it. I want to see which microphone is selected, start recording, and find something I said yesterday without opening a giant file.\n\nLet's get the port and the interface right first."},{time:'10:18',text:"Can we move the meeting to Thursday afternoon? I'll send the updated notes before then."},{time:'09:56',text:"Koett should keep the original transcript when a replacement is applied. That makes it easier to check what actually happened."}];let selected=0;const $=id=>document.getElementById(id);function render(){const query=$('search').value.toLowerCase();$('entries').replaceChildren();examples.forEach((entry,index)=>{if(!entry.text.toLowerCase().includes(query))return;const button=document.createElement('button');button.className='entry'+(index===selected?' selected':'');const time=document.createElement('time');time.textContent=entry.time;const text=document.createElement('span');text.className='snippet';text.textContent=entry.text;button.append(time,text);button.onclick=()=>{selected=index;show();$('app').classList.add('reading');render()};$('entries').append(button)});if(!$('entries').children.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='No matches';$('entries').append(empty)}}function show(){$('date').textContent='Today, '+examples[selected].time;$('transcript').textContent=examples[selected].text;$('copy').textContent='Copy'}$('search').oninput=render;$('settings-button').onclick=()=>{const open=$('app').classList.toggle('settings-open');$('settings-button').textContent=open?'History':'Settings'};$('record').onclick=()=>{const recording=$('record-label').textContent==='Record';$('record-label').textContent=recording?'Stop':'Record';$('status').textContent=recording?'Recording · 0:00':'Ready';$('footer-state').textContent=recording?'Press the shortcut again to stop':'Ctrl + Shift + Space to record'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(examples[selected].text);$('copy').textContent='Copied'}catch{$('transcript').focus();const range=document.createRange();range.selectNodeContents($('transcript'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);$('copy').textContent='Text selected'}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([examples[selected].text],{type:'text/plain'}));a.download='Koett-transcript.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('back').onclick=()=>$('app').classList.remove('reading');$('reset').onclick=()=>{selected=0;$('search').value='';$('app').classList.remove('settings-open','reading');$('settings-button').textContent='Settings';$('record-label').textContent='Record';$('status').textContent='Ready';show();render()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();$('app').classList.remove('settings-open','reading');$('settings-button').textContent='Settings';$('search').focus()}});show();render();console.log('Koett design reference: 3 example entries; native implementation tracked separately');
</script></body></html>
